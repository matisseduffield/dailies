<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#E8ECE5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1412" media="(prefers-color-scheme: dark)">
<meta name="description" content="Dailies: a few small daily games, new every day. Free, no ads.">
<title>Dailies</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect x=%223%22 y=%223%22 width=%2212%22 height=%2212%22 rx=%223%22 fill=%22%23F4C52E%22/><rect x=%2217%22 y=%223%22 width=%2212%22 height=%2212%22 rx=%223%22 fill=%22%232C53C4%22/><rect x=%223%22 y=%2217%22 width=%2212%22 height=%2212%22 rx=%223%22 fill=%22%232C53C4%22/><rect x=%2217%22 y=%2217%22 width=%2212%22 height=%2212%22 rx=%223%22 fill=%22%231D7548%22/></svg>">
<link rel="preload" href="fonts/hanken-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="shared.css">
<style>
.today { padding-top: 14px; }
.today h2 { font-size: 1.6rem; font-weight: 600; letter-spacing: -.015em; line-height: 1.2; }
.today p { margin-top: 2px; font-size: .92rem; color: var(--muted); }

/* A row for each game */
.games { display: grid; gap: 8px; margin-top: 16px; }
.game {
  display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 12px;
  min-height: 64px; padding: 9px 14px 9px 12px;
  background: var(--surface); border-radius: 10px;
  color: inherit; text-decoration: none;
}
.game:active { background: var(--key); }
.game b { display: block; font-size: 1.05rem; font-weight: 600; line-height: 1.3; }
.game span { display: block; font-size: .88rem; line-height: 1.35; color: var(--muted); }
.game .state { color: var(--faint); }
.game.done .state { color: var(--pos); }

.get-app { margin-top: auto; padding: 18px 0 8px; text-align: center; font-size: .86rem; color: var(--muted); }
.get-app .link { font-size: .86rem; text-decoration: none; }

/* App update (Android app only) */
.update { display: grid; gap: 14px; margin-top: 8px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.update-title { font-weight: 600; line-height: 1.3; }
.update-sub, .update-msg { font-size: .84rem; color: var(--muted); }
.update-notes { margin: 0; padding: 0 0 0 16px; font-size: .88rem; line-height: 1.4; }
.share-all { width: 100%; margin-top: 14px; }
.update-progress { display: flex; align-items: center; gap: 12px; min-height: 46px; }
.update-track { flex: 1; height: 6px; border-radius: 3px; background: var(--accent-soft); overflow: hidden; }
.update-track span { display: block; height: 100%; width: 0; border-radius: 3px; background: var(--accent); transition: width .2s; }
.update-pct { min-width: 3.2ch; text-align: right; font-size: .86rem; font-weight: 600; }
@media (prefers-reduced-motion: reduce) { .update-track span { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="top">
      <div class="brand">
        <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="12" height="12" rx="3" fill="#F4C52E"/><rect x="17" y="3" width="12" height="12" rx="3" fill="#2C53C4"/><rect x="3" y="17" width="12" height="12" rx="3" fill="#2C53C4"/><rect x="17" y="17" width="12" height="12" rx="3" fill="#1D7548"/></svg>
        <h1 class="mark">Dailies</h1>
      </div>
      <div class="top-right">
        <button class="version" id="version" type="button" title="Check for updates" hidden></button>
      </div>
    </div>
  </header>

  <section class="update" id="updateCard" aria-label="App update" hidden>
    <div>
      <p class="update-title" id="updateTitle">Update available</p>
      <p class="update-sub" id="updateSub"></p>
    </div>
    <ul class="update-notes" id="updateNotes" hidden></ul>
    <p class="update-msg" id="updateMsg" hidden></p>
    <div class="update-progress" id="updateProgress" hidden>
      <div class="update-track"><span id="updateBar"></span></div>
      <span class="update-pct" id="updatePct">0%</span>
    </div>
    <div class="actions" id="updateActions">
      <button class="btn btn-secondary" id="updateLater" type="button">Not now</button>
      <button class="btn btn-primary" id="updateGo" type="button">Update</button>
    </div>
  </section>

  <main>
    <div class="today">
      <h2 id="date"></h2>
      <p id="progress"></p>
    </div>
    <nav class="games" id="games" aria-label="Today's games"></nav>
    <button class="btn btn-primary share-all" id="shareAll" type="button" hidden>Share today</button>
  </main>

  <p class="get-app" id="getApp" hidden>On Android? <a class="link" href="/app">Get the app</a>, free and offline.</p>
</div>

<script src="clock.js?v=1"></script>
<script>
(() => {
  // Every game in the hub: its folder, its name and a line about it. A game
  // tells the hub how today went by saving { date, text } as hub.<id>.
  const SLUG = '<path d="M43 29 38 13M52 28l4-16" stroke="#F4C52E" stroke-width="4.5" stroke-linecap="round"/><path fill="#F4C52E" d="M3 53C3 48 12 47 19 45 27 43 30 35 36 30 42 25 54 25 58 33 61 39 60 48 55 52 53 54 50 55 46 55H7C4 55 3 54 3 53Z"/><g fill="#D99F14"><circle cx="24" cy="49.5" r="2.4"/><circle cx="33.5" cy="44" r="3"/><circle cx="14" cy="51" r="1.7"/><circle cx="37" cy="51" r="1.6"/></g><path d="M43 39.5Q50 48 57.5 38" fill="none" stroke="#14211C" stroke-width="2.6" stroke-linecap="round"/><path fill="#EE6A7C" stroke="#14211C" stroke-width="1.6" stroke-linejoin="round" d="M47.5 43.6c.3 4.6 1.8 7 4 6.8 2.1-.2 3-3 2.4-7.4"/><g stroke="#14211C" stroke-width="1.8"><circle cx="38" cy="11" r="7.4" fill="#fff"/><circle cx="56.5" cy="10" r="7.4" fill="#fff"/></g><circle cx="40.4" cy="13.2" r="3.1" fill="#14211C"/><circle cx="54.4" cy="7.8" r="3.1" fill="#14211C"/>';
  const BULB = '<path fill="#F4C52E" d="M32 5a20 20 0 0 0-12 36c3 2.4 4 5 4 8h16c0-3 1-5.6 4-8A20 20 0 0 0 32 5Z"/><rect x="25" y="52" width="14" height="7" rx="3.5" fill="#8C968F"/>';
  const BARS = '<rect x="6" y="8" width="52" height="11" rx="3.5" fill="#F4C52E"/><rect x="6" y="21" width="52" height="11" rx="3.5" fill="#5DBB85"/><rect x="6" y="34" width="52" height="11" rx="3.5" fill="#7F9FF0"/><rect x="6" y="47" width="52" height="11" rx="3.5" fill="#B58CE3"/>';
  const RINGS = '<circle cx="32" cy="32" r="28" fill="#F4C52E"/><circle cx="32" cy="32" r="18" fill="#2C53C4"/><circle cx="32" cy="32" r="8" fill="#F4C52E"/>';
  const GRID = '<rect x="6" y="6" width="52" height="52" fill="#14211C"/><rect x="7" y="7" width="16" height="16" fill="#F4C52E"/><rect x="24" y="7" width="16" height="16" fill="#BFD2F8"/><rect x="41" y="7" width="16" height="16" fill="#BFD2F8"/><rect x="7" y="24" width="16" height="16" fill="#FCFCF8"/><rect x="24" y="24" width="16" height="16" fill="#FCFCF8"/><rect x="24" y="41" width="16" height="16" fill="#FCFCF8"/><rect x="41" y="41" width="16" height="16" fill="#FCFCF8"/>';
  const WEAVE = '<rect x="6" y="16" width="52" height="12" rx="3" fill="#1D7548"/><rect x="6" y="36" width="52" height="12" rx="3" fill="#1D7548"/><rect x="16" y="6" width="12" height="52" rx="3" fill="#F4C52E"/><rect x="36" y="6" width="12" height="52" rx="3" fill="#F4C52E"/><rect x="16" y="16" width="12" height="12" fill="#1D7548"/><rect x="36" y="36" width="12" height="12" fill="#1D7548"/>';
  const ROWS = '<rect x="6" y="8" width="40" height="13" rx="3" fill="#2C53C4"/><rect x="18" y="25.5" width="40" height="13" rx="3" fill="#F4C52E"/><rect x="6" y="43" width="40" height="13" rx="3" fill="#2C53C4"/>';
  const ROUTE = '<path d="M15 49 27 40 24 25 40 26 49 15" stroke="#1D7548" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="15" cy="49" r="10" fill="#F4C52E"/><circle cx="49" cy="15" r="10" fill="#2C53C4"/>';
  const GAMES = [
    { id: 'slugle', name: 'Slugle', line: 'Turn today’s word into SLUG', icon: SLUG },
    { id: 'hunch', name: 'Hunch', line: 'Find the hidden word in six tries', icon: BULB },
    { id: 'sorted', name: 'Sorted', line: 'Find four groups of four words', icon: BARS },
    { id: 'reach', name: 'Reach', line: 'Hit the target with six numbers', icon: RINGS },
    { id: 'cluey', name: 'Cluey', line: 'A small crossword, slyer each day', icon: GRID },
    { id: 'mend', name: 'Mend', line: 'Swap letters back into words', icon: WEAVE },
    { id: 'dated', name: 'Dated', line: 'Put history in order, blind', icon: ROWS },
    { id: 'overland', name: 'Overland', line: 'Cross the map, border by border', icon: ROUTE },
  ];
  const SITE = 'https://dailies.matisseduffield.workers.dev';

  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem('hub.' + k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem('hub.' + k, JSON.stringify(v)); } catch {} },
  };
  const dateFormat = new Intl.DateTimeFormat(navigator.language || 'en', { weekday: 'long', day: 'numeric', month: 'long' });

  let shownDay = '';
  function render() {
    const now = Clock.now(), day = now.toDateString();
    let done = 0;
    shownDay = day;
    $('date').textContent = dateFormat.format(now);
    $('games').replaceChildren(...GAMES.map(g => {
      const result = store.get(g.id);
      const played = !!result && result.date === day;
      if (played) done++;
      const a = el('a', played ? 'game done' : 'game');
      a.href = `${g.id}/index.html`;
      a.innerHTML = `<svg width="40" height="40" viewBox="0 0 64 64" fill="none" aria-hidden="true">${g.icon}</svg>`;
      const text = el('div');
      text.append(el('b', '', g.name), el('span', '', played ? result.text : g.line));
      a.append(text, el('span', 'state', played ? 'Done' : 'Play'));
      return a;
    }));
    $('progress').textContent = done === GAMES.length ? 'All done. See you tomorrow.' : `${done} of ${GAMES.length} played today`;
    $('shareAll').hidden = done !== GAMES.length;
  }
  // Every result in one message, once the day's games are done.
  function shareAll() {
    const lines = GAMES.map(g => `${g.name}: ${(store.get(g.id) || {}).text || ''}`);
    const text = [`Dailies, ${dateFormat.format(Clock.now())}`, ...lines, SITE].join('\n');
    if (window.ladderApp) return toApp({ type: 'share', title: 'Dailies', text });
    if (navigator.share) return navigator.share({ text }).catch(() => {});
    navigator.clipboard.writeText(text).then(() => {
      $('shareAll').textContent = 'Copied';
      setTimeout(() => { $('shareAll').textContent = 'Share today'; }, 1600);
    }, () => {});
  }
  $('shareAll').addEventListener('click', shareAll);

  // Coming back from a game, or back to the app on a new day.
  addEventListener('pageshow', render);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
  addEventListener('clock', render);
  setInterval(() => { if (!document.hidden && Clock.now().toDateString() !== shownDay) render(); }, 30000);

  // ---- Android app bridge (absent in a browser) ----
  const app = window.ladderApp || null;
  function toApp(msg) {
    if (!app) return;
    try { app.postMessage(JSON.stringify(msg)); } catch {}
  }
  let appVersion = '', updateReady = false, versionTimer = 0, updateVersion = '', updateSize = 0;
  function showVersion(text, st) {
    clearTimeout(versionTimer);
    $('version').hidden = false;
    $('version').textContent = text;
    $('version').dataset.state = st || '';
  }
  function showUpdate(m) {
    const show = (id, on) => { $(id).hidden = !on; };
    $('updateCard').hidden = false;
    if (m.state === 'available') {
      updateVersion = m.version || updateVersion;
      updateSize = m.size > 0 ? m.size : updateSize;
      const notes = Array.isArray(m.notes) ? m.notes.filter(n => typeof n === 'string' && n).slice(0, 5) : [];
      $('updateNotes').replaceChildren(...notes.map(n => el('li', '', n)));
      show('updateNotes', notes.length > 0);
    }
    const view = {
      available: { title: 'Update available', msg: '', actions: true, progress: false, go: 'Update' },
      downloading: { title: 'Downloading update', msg: '', actions: false, progress: true },
      installing: { title: 'Installing update', actions: false, progress: true, msg: 'Confirm on the next screen. The first time, Android asks you to allow installs from Dailies. Turn it on, then go back.' },
      failed: { title: "Update didn't finish", msg: m.message || 'Something went wrong. Try again.', actions: true, progress: false, go: 'Try again' },
    }[m.state];
    if (!view) return;
    $('updateTitle').textContent = view.title;
    $('updateSub').textContent = [`Dailies ${updateVersion}`, updateSize ? `${(updateSize / 1e6).toFixed(1)} MB` : ''].filter(Boolean).join(' · ');
    $('updateMsg').textContent = view.msg;
    show('updateMsg', !!view.msg);
    show('updateActions', view.actions);
    show('updateProgress', view.progress);
    if (view.go) $('updateGo').textContent = view.go;
    if (view.progress) {
      const p = m.state === 'installing' ? 100 : Math.round(Math.max(0, Math.min(1, m.progress || 0)) * 100);
      $('updateBar').style.width = p + '%';
      $('updatePct').textContent = p + '%';
    }
  }
  if (app) {
    app.onmessage = e => {
      let m;
      try { m = JSON.parse(e.data); } catch { return; }
      if (m.type === 'info') {
        appVersion = m.version;
        const seen = store.get('seenVersion');
        store.set('seenVersion', appVersion);
        if (!updateReady && seen && seen !== appVersion) {
          showVersion(`Updated to v${appVersion}`, 'available');
          versionTimer = setTimeout(() => showVersion(`v${appVersion}`), 4000);
        } else if (!updateReady) showVersion(`v${appVersion}`);
      } else if (m.type === 'updateStatus') {
        if (m.state === 'available') { updateReady = true; return showVersion('Update available', 'available'); }
        showVersion(m.state === 'latest' ? 'Up to date' : "Couldn't check");
        versionTimer = setTimeout(() => showVersion(`v${appVersion}`), 2500);
      } else if (m.type === 'update') {
        if (m.state === 'available') { updateReady = true; showVersion('Update available', 'available'); }
        showUpdate(m);
      }
    };
    $('updateGo').addEventListener('click', () => { showUpdate({ state: 'downloading', progress: 0 }); toApp({ type: 'installUpdate' }); });
    $('updateLater').addEventListener('click', () => { $('updateCard').hidden = true; });
    $('version').addEventListener('click', () => {
      if (updateReady) { $('updateCard').hidden = false; return; }
      showVersion('Checking…');
      toApp({ type: 'checkUpdate' });
    });
  }

  // ---- boot ----
  $('getApp').hidden = !!app || location.origin !== SITE;
  render();
  toApp({ type: 'hello' });
})();
</script>
</body>
</html>
