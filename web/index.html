<style>
/* The list runs past a short screen: the page grows, so the bottom padding stays clear of the home bar */
.app { height: auto; min-height: 100dvh; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
/* The day, plain on the page as a calculator shows its sum: the date as its label, how far
   along you are as its value, and at the right the last week as a row of dots, today last:
   white for a day with every game played, grey for some, dim for none. */
.today { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 16px; margin-top: 22px; padding: 0 6px; }
.today > div:first-child { min-width: 0; }
.today-label { font-size: 1rem; line-height: 1.4; color: var(--muted); }
.today h2 { margin-top: 2px; font-size: clamp(1.65rem, 8vw, 2.15rem); font-weight: 400; letter-spacing: -.02em; line-height: 1.2; white-space: nowrap; }
.today h2 b { font-weight: 400; color: var(--accent); }
.days { margin-bottom: 15px; }
.days { flex: none; display: flex; gap: 7px; }
.days i { width: 6px; height: 6px; border-radius: 50%; background: var(--line-strong); }
.days i.some { background: var(--muted); }
.days i.all { background: var(--ink); }

/* The games, three to a row and no tile behind them: its picture, its name, and once it is
   begun, where it stands today: "Started" in grey, then how it went, green if won and red if lost. */
.games { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 26px 8px; margin-top: 38px; }
.game { display: grid; justify-items: center; align-content: start; padding-bottom: 4px; color: inherit; text-decoration: none; text-align: center; }
.game svg { width: 62px; height: 62px; margin-bottom: 10px; }
.game:active { opacity: .6; }
@media (hover: hover) { .game:hover { opacity: .8; } }
/* A short screen: the rows sit closer, so all four are in view with their results.
   The pictures stay the size they are. */
@media (max-height: 700px) {
  .today { margin-top: 10px; }
  .games { gap: 14px 8px; margin-top: 20px; }
  .game { padding-bottom: 0; }
  .game svg { margin-bottom: 6px; }
}
.game b { font-size: 1rem; font-weight: 400; line-height: 1.3; }
.game span { font-size: .82rem; line-height: 1.3; color: var(--muted); overflow-wrap: anywhere; }
.game.done > span { color: var(--pos); }
.game.done.lost > span { color: var(--neg); }
/* Said to a screen reader, as the colour or a picture can't be */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* More: a small dark panel that drops from its button, a picture and a word for each thing */
.menu { position: absolute; z-index: 5; top: calc(68px + env(safe-area-inset-top, 0px)); right: max(18px, env(safe-area-inset-right, 0px)); min-width: 192px; max-width: calc(100% - 36px); padding: 9px 8px; background: var(--pop); border: 1px solid var(--pop-line); border-radius: 28px; box-shadow: 0 12px 32px rgba(0, 0, 0, .4); transform-origin: top right; animation: pop .14s ease-out; }
@keyframes pop { from { opacity: 0; transform: scale(.94); } }
.menu-row { display: flex; align-items: center; gap: 15px; width: 100%; min-height: 46px; padding: 0 20px 0 16px; background: none; border: 0; border-radius: 18px; font-size: 1.06rem; text-align: left; white-space: nowrap; }
.menu-row:active { background: var(--key); }
@media (hover: hover) { .menu-row:not(:disabled):hover { background: var(--key); } }
.menu-row:disabled { opacity: .38; cursor: default; }
.menu-row svg { flex: none; }
.menu-row span { flex: 1; }
/* The reminder is ticked while it's on */
.menu-row .tick { display: none; color: var(--accent); }
.menu-row[aria-checked="true"] .tick { display: block; }
/* ios:cut */
.menu-row[data-state="available"] span { color: var(--accent); }
/* An update is waiting: a dot on the button */
#menuBtn[data-state="available"]::after { content: ""; position: absolute; top: 9px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
/* ios:end */
@media (prefers-reduced-motion: reduce) { .menu { animation: none; } }

/* ios:cut */
.install-hint { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0 0; font-size: .84rem; line-height: 1.35; color: var(--muted); }
.install-hint button { flex: none; width: 44px; height: 44px; margin: -10px -12px -10px 0; padding: 0; background: none; border: 0; font-size: 1.2rem; color: var(--muted); }
/* ios:end */

/* About: who this is, then one rounded list, a row for each thing, with a hairline between them */
/* What this is, on a card of its own: the icon, with the name and a line about it beside it */
.about-id { display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 16px; row-gap: 2px; padding: 18px 20px; background: var(--surface); border-radius: 24px; text-align: left; }
.about-id img { grid-row: 1 / 3; border-radius: 13px; }
.about-id .about-name { align-self: end; font-size: 1.25rem; font-weight: 500; letter-spacing: -.01em; line-height: 1.25; }
.about-id .about-tag { align-self: start; font-size: .95rem; line-height: 1.35; color: var(--muted); }
/* About is a page of its own: it fills the screen and Back leaves it */
dialog.sheet.aboutpg { width: 100%; max-width: none; height: 100dvh; max-height: 100dvh; margin: 0; padding-top: env(safe-area-inset-top, 0px); border-radius: 0; background: var(--bg); }
dialog.sheet.aboutpg[open] { display: flex; flex-direction: column; animation: none; }
.aboutpg > * { width: 100%; max-width: 480px; margin-inline: auto; }
.aboutpg .sheet-head { justify-content: flex-start; gap: 10px; padding: 14px 18px 6px; background: var(--bg); }
.aboutpg .sheet-head h2 { font-size: 1.35rem; font-weight: 500; }
.aboutpg .sheet-body { flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 14px 18px max(22px, env(safe-area-inset-bottom, 0px)); }
.aboutpg .about-foot { margin-top: auto; }
.about-links { display: grid; padding: 0 20px; background: var(--surface); border-radius: 24px; }
/* A card with nothing to show (the version, on a page that has none) isn't drawn */
.about-links:not(:has(> .about-row:not([hidden]))) { display: none; }
.about-legal { display: contents; }
.about-links .about-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; margin: 0; padding: 12px 0; background: none; border: 0; font-size: 1.06rem; line-height: 1.3; color: var(--ink); text-align: left; text-decoration: none; }
.about-links > :not([hidden]) ~ .about-row, .about-legal .about-row { border-top: 1px solid var(--line); }
.about-row small { display: block; margin-top: 2px; font-size: .9rem; color: var(--muted); }
.about-row > span + span { flex: none; font-size: 1rem; color: var(--muted); }
.about-row > span + span:empty { display: none; }
a.about-row::after { content: ""; flex: none; width: 9px; height: 9px; margin-right: 3px; border: solid var(--line-strong); border-width: 1.5px 1.5px 0 0; transform: rotate(45deg); }
.sheet-body .about-foot { text-align: center; font-size: .8rem; color: var(--muted); }

/* ios:cut */
/* App update (Android app only) */
.update { display: grid; gap: 14px; margin-top: 8px; padding: 20px; background: var(--surface); border-radius: 24px; }
.update-title { font-weight: 600; line-height: 1.3; }
.update-sub, .update-msg { font-size: .84rem; color: var(--muted); }
.update-notes { margin: 0; padding: 0 0 0 16px; font-size: .88rem; line-height: 1.4; }
.update-progress { display: flex; align-items: center; gap: 12px; min-height: 46px; }
.update-track { flex: 1; height: 6px; border-radius: 3px; background: var(--accent-soft); overflow: hidden; }
.update-track span { display: block; height: 100%; width: 0; border-radius: 3px; background: var(--accent); transition: width .2s; }
.update-pct { min-width: 3.2ch; text-align: right; font-size: .86rem; font-weight: 600; }
@media (prefers-reduced-motion: reduce) { .update-track span { transition: none; } }
/* ios:end */
</style>
</head>

  function showMenu(on) {
    menu.hidden = !on;
    $('menuBtn').setAttribute('aria-expanded', on);
  }
  $('menuBtn').addEventListener('click', () => {
    showMenu(menu.hidden);
  });
  // A tap anywhere else, or Escape, puts it away
  // A tap anywhere else puts the menu away, and like the phone's own menus that tap does nothing else.
  let swallow = false;
  document.addEventListener('pointerdown', e => {
    swallow = false;
    if (menu.hidden || e.target.closest('#menu, #menuBtn')) return;
    showMenu(false);
    swallow = true;
    e.stopPropagation();
  }, true);
  for (const type of ['pointerup', 'pointercancel']) document.addEventListener(type, () => setTimeout(() => { swallow = false; }), true);
  document.addEventListener('click', e => { if (swallow) { swallow = false; e.stopPropagation(); e.preventDefault(); } }, true);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !menu.hidden) { showMenu(false); $('menuBtn').focus(); } });
  about.addEventListener('click', e => { if (e.target === about || e.target.closest('[data-close]')) about.close(); });
  about.addEventListener('close', tellBack);

  // The 6 pm reminder/* ios:cut */, in the iPhone app/* ios:end */: the app plans it (window.ladderRemind).
  // Notifications were refused: only the phone's Settings can turn them back on.
  let remindBlocked = false;
  function showRemind() {
    const on = !!store.get('remind');
    $('remindToggle').hidden = false;
    // Refused: the row leads to the phone's Settings instead
    $('remindText').textContent = !on && remindBlocked ? 'Turn on notifications' : 'Remind me at 6 pm';
    $('remindToggle').setAttribute('aria-checked', on);
    /* ios:cut */ if (window.ladderRemind) /* ios:end */ window.ladderRemind();
  }
  $('remindToggle').addEventListener('click', () => {
    if (!store.get('remind')) return toApp({ type: remindBlocked ? 'openSettings' : 'askNotifications' });
    store.set('remind', false);
    showRemind();
  });

  // ---- boot ----
  /* ios:cut */
  $('getApp').hidden = !!app || inApp || !/Android/.test(navigator.userAgent);
  /* ios:end */
  render();
  toApp({ type: 'hello' });
  // Back in front: notifications may have been switched in Settings meanwhile.
  window.ladderAsk = () => toApp({ type: 'hello' });
})();
</script>
</body>
</html>
